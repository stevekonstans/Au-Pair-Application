  <!-- Left Side Leaf -->
  <path d="M 126 122 C 72 92 42 118 48 152 C 78 182 126 152 136 134 Z" fill="#0f172a" />
  <path d="M 126 122 Q 84 140 48 152" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Right Side Leaf -->
  <path d="M 174 122 C 228 92 258 118 252 152 C 222 182 174 152 164 134 Z" fill="#0f172a" />
  <path d="M 174 122 Q 216 140 252 152" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Base Arch -->
